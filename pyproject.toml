[project]
name = "sourceroi"
version = "0.2.0"
description = "Real-data, source-level evaluation and regression testing for AI agents"
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
sourceroi = "sourceroi.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sourceroi*"]

[tool.setuptools.package-data]
"sourceroi.live" = ["web/*.html", "web/*.css", "web/*.js"]
"sourceroi" = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
